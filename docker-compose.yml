services:
  db:
    image: postgres:16-alpine
    container_name: fantasy-pickup-db
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy_pickup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_pickup"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
